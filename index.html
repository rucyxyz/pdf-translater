<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDF 全文自動翻訳</title>
<style>
  :root {
    --bg:#f7f8fa; --card:#fff; --border:#e2e5ea; --accent:#2563eb;
    --text:#1f2937; --muted:#6b7280; --danger:#dc2626;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans",
      "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
    background: var(--bg); color: var(--text); font-size:16px; line-height:1.6;
    margin:0; padding: env(safe-area-inset-top) env(safe-area-inset-right)
             env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .wrap { max-width:960px; margin:0 auto; padding:16px; }
  h1 { font-size:1.25rem; margin:8px 0 16px; text-align:center; }
  .controls {
    display:flex; flex-direction:column; gap:10px; background:var(--card);
    border:1px solid var(--border); border-radius:12px; padding:14px; margin-bottom:12px;
  }
  .file-row { display:flex; flex-direction:column; gap:6px; }
  .file-row label { font-size:.85rem; color:var(--muted); }
  input[type="file"], input[type="number"], select {
    width:100%; padding:10px; border:1px solid var(--border); border-radius:8px;
    background:#fff; font-size:1rem; color: var(--text);
  }
  .row-inline { display:flex; gap:8px; flex-wrap:wrap; }
  .row-inline > * { flex:1 1 140px; }
  .row-inline.small > * { flex:1 1 90px; }
  button {
    padding:12px 16px; border:none; border-radius:8px; background:var(--accent);
    color:#fff; font-size:1rem; font-weight:600; cursor:pointer; width:100%;
    transition:opacity .15s;
  }
  button:disabled { opacity:.5; cursor:not-allowed; }
  button.secondary { background:#fff; color:var(--accent); border:1px solid var(--accent); }
  button.danger { background:#fff; color:var(--danger); border:1px solid var(--danger); }
  #status { min-height:1.2em; margin:8px 4px; font-size:.9rem; color:var(--muted); text-align:center; }

  .accordion { background:var(--card); border:1px solid var(--border);
    border-radius:12px; margin-bottom:12px; overflow:hidden; }
  .acc-header {
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 16px; cursor:pointer; user-select:none; font-weight:600; background:#fff;
  }
  .acc-header:hover { background:#f1f3f7; }
  .acc-header .title { display:flex; align-items:center; gap:8px; font-size:1rem; }
  .acc-header .arrow { transition:transform .25s; font-size:.9rem; color:var(--muted); }
  .accordion.open .acc-header .arrow { transform:rotate(180deg); }
  .acc-body { max-height:0; overflow:hidden; transition:max-height .3s ease;
    border-top:1px solid transparent; }
  .accordion.open .acc-body { border-top-color:var(--border); }
  .acc-content {
    padding:12px 16px 16px; white-space:pre-wrap; word-break:break-word;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size:.9rem; line-height:1.7; color:#111; background:#fafbfc;
    max-height:60vh; overflow-y:auto;
  }
  .acc-content:empty::before { content:"（まだ内容がありません）"; color:var(--muted);
    font-style:italic; font-family:inherit; }
  .badge { background:var(--accent); color:#fff; font-size:.7rem; padding:2px 8px;
    border-radius:999px; font-weight:500; }
  .progress {
    height:6px; background:#e5e7eb; border-radius:999px; overflow:hidden; margin:8px 4px;
  }
  .progress > div { height:100%; width:0%; background:var(--accent); transition:width .3s; }

  @media (min-width:640px) {
    h1 { font-size:1.5rem; margin-top:16px; }
    .controls { flex-direction:row; align-items:flex-end; flex-wrap:wrap; }
    .file-row { flex:2 1 260px; }
    button { width:auto; }
    .acc-content { font-size:.92rem; max-height:65vh; }
  }
</style>
</head>
<body>

<div class="wrap">
  <h1>PDF 全文自動翻訳</h1>

  <div class="controls">
    <div class="file-row">
      <label for="pdfFile">PDFファイル</label>
      <input type="file" id="pdfFile" accept="application/pdf">
    </div>

    <div class="row-inline small">
      <select id="targetLang" aria-label="翻訳先言語">
        <option value="ja">日本語</option>
        <option value="en">英語</option>
        <option value="ko">韓国語</option>
        <option value="zh-CN">中国語（簡体）</option>
        <option value="fr">フランス語</option>
        <option value="de">ドイツ語</option>
        <option value="es">スペイン語</option>
      </select>
      <input type="number" id="maxPages" min="0" placeholder="先頭N ページ (0=全部)" title="0 または空欄で全ページ">
    </div>

    <div class="row-inline">
      <button id="translateBtn">翻訳開始</button>
      <button id="cancelBtn" class="danger" disabled>停止</button>
      <button id="downloadBtn" class="secondary" disabled>翻訳テキストをDL</button>
    </div>
  </div>

  <div id="status"></div>
  <div class="progress"><div id="progressBar"></div></div>

  <div class="accordion" id="accOriginal">
    <div class="acc-header" data-target="accOriginal">
      <span class="title">📄 原文 <span class="badge" id="origBadge" hidden></span></span>
      <span class="arrow">▼</span>
    </div>
    <div class="acc-body"><div class="acc-content" id="original"></div></div>
  </div>

  <div class="accordion" id="accTranslated">
    <div class="acc-header" data-target="accTranslated">
      <span class="title">🌐 翻訳 <span class="badge" id="transBadge" hidden></span></span>
      <span class="arrow">▼</span>
    </div>
    <div class="acc-body"><div class="acc-content" id="translated"></div></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
const pdfjsLib = window.pdfjsLib;
pdfjsLib.GlobalWorkerOptions.workerSrc =
  'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

/* ============ 設定（速さの主要パラメータ） ============ */
const EXTRACT_CONCURRENCY   = 10;   // PDF抽出の並列数
const TRANSLATE_CONCURRENCY = 6;    // 翻訳の並列数（6〜10推奨）
const CHUNK_SIZE            = 1200; // 1リクエストの文字数（大きいほど速いが失敗率↑）
const MAX_RETRY             = 3;
const UI_THROTTLE_MS        = 2000; // DOM更新間隔

/* ============ DOM ============ */
const fileInput    = document.getElementById('pdfFile');
const translateBtn = document.getElementById('translateBtn');
const cancelBtn    = document.getElementById('cancelBtn');
const downloadBtn  = document.getElementById('downloadBtn');
const statusEl     = document.getElementById('status');
const progressBar  = document.getElementById('progressBar');
const originalEl   = document.getElementById('original');
const translatedEl = document.getElementById('translated');
const targetLang   = document.getElementById('targetLang');
const maxPagesEl   = document.getElementById('maxPages');
const origBadge    = document.getElementById('origBadge');
const transBadge   = document.getElementById('transBadge');

let translatedText = '';
let cancelFlag = false;

/* ============ アコーディオン ============ */
document.querySelectorAll('.acc-header').forEach(header => {
  header.addEventListener('click', () => {
    const acc = document.getElementById(header.dataset.target);
    const body = acc.querySelector('.acc-body');
    const isOpen = acc.classList.toggle('open');
    if (isOpen) {
      body.style.maxHeight = body.scrollHeight + 'px';
      setTimeout(() => { if (acc.classList.contains('open')) body.style.maxHeight = 'none'; }, 320);
    } else {
      body.style.maxHeight = body.scrollHeight + 'px';
      requestAnimationFrame(() => { body.style.maxHeight = '0px'; });
    }
  });
});
function autoOpen(id) {
  const acc = document.getElementById(id);
  if (acc.classList.contains('open')) return;
  acc.classList.add('open');
  acc.querySelector('.acc-body').style.maxHeight = 'none';
}

fileInput.addEventListener('change', () => {
  const f = fileInput.files[0];
  if (!f) return;
  origBadge.hidden = false;
  origBadge.textContent = f.name.length > 22 ? f.name.slice(0, 22) + '…' : f.name;
});

/* ============ ユーティリティ ============ */
const sleep = ms => new Promise(r => setTimeout(r, ms));
const fmtTime = s => {
  if (!isFinite(s) || s < 0) return '--:--';
  s = Math.round(s);
  const m = Math.floor(s / 60), sec = s % 60;
  if (m >= 60) return `${Math.floor(m/60)}h ${m%60}m`;
  return `${m}:${String(sec).padStart(2,'0')}`;
};

function setProgress(p) {
  progressBar.style.width = Math.max(0, Math.min(100, p * 100)) + '%';
}

/* 並列実行プール：items を limit 並列で worker に渡す */
async function runPool(count, limit, worker) {
  let idx = 0;
  const runners = Array.from({ length: Math.min(limit, count) }, async () => {
    while (true) {
      if (cancelFlag) return;
      const i = idx++;
      if (i >= count) return;
      await worker(i);
    }
  });
  await Promise.all(runners);
}

/* 長文分割（句点・改行優先、区切りがなければ強制分割） */
function splitText(text, maxLen) {
  const sentences = text.split(/(?<=[。．.!?！？\n])/);
  const chunks = [];
  let cur = '';
  for (const s of sentences) {
    if (s.length > maxLen) {
      if (cur) { chunks.push(cur); cur = ''; }
      for (let i = 0; i < s.length; i += maxLen) chunks.push(s.slice(i, i + maxLen));
      continue;
    }
    if ((cur + s).length > maxLen) { chunks.push(cur); cur = s; }
    else cur += s;
  }
  if (cur) chunks.push(cur);
  return chunks;
}

/* Google 非公式エンドポイント */
async function translateGoogle(text, tl) {
  const url =
    'https://translate.googleapis.com/translate_a/single' +
    `?client=gtx&sl=auto&tl=${tl}&dt=t&q=${encodeURIComponent(text)}`;
  const res = await fetch(url);
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const data = await res.json();
  return data[0].map(x => x[0]).join('');
}

/* ============ 抽出 ============ */
async function extractAllPages(pdf, limitPages, onProgress) {
  const total = limitPages > 0 ? Math.min(limitPages, pdf.numPages) : pdf.numPages;
  const pageTexts = new Array(total);
  let done = 0;
  const t0 = performance.now();
  await runPool(total, EXTRACT_CONCURRENCY, async (i) => {
    const page = await pdf.getPage(i + 1);
    const content = await page.getTextContent();
    pageTexts[i] = content.items.map(it => it.str).join(' ') + '\n\n';
    page.cleanup();
    done++;
    const elapsed = (performance.now() - t0) / 1000;
    const speed = done / elapsed;
    const eta = (total - done) / speed;
    onProgress(done, total, `抽出中 ${done}/${total} ページ（${speed.toFixed(0)} p/s・残り ${fmtTime(eta)}）`);
  });
  return pageTexts.join('');
}

/* ============ 翻訳 ============ */
async function translateAll(chunks, tl, onProgress, onPartial) {
  const total = chunks.length;
  const results = new Array(total);
  let done = 0;
  let failed = 0;
  const t0 = performance.now();
  let lastUi = 0;

  await runPool(total, TRANSLATE_CONCURRENCY, async (i) => {
    let attempt = 0;
    while (attempt <= MAX_RETRY) {
      try {
        results[i] = await translateGoogle(chunks[i], tl);
        break;
      } catch (e) {
        attempt++;
        if (attempt > MAX_RETRY) { results[i] = ''; failed++; break; }
        await sleep(300 * Math.pow(2, attempt - 1));
      }
    }
    done++;
    const now = performance.now();
    if (now - lastUi > UI_THROTTLE_MS || done === total) {
      lastUi = now;
      const elapsed = (now - t0) / 1000;
      const speed = done / elapsed;
      const eta = (total - done) / speed;
      onProgress(done, total,
        `翻訳中 ${done}/${total} チャンク（${speed.toFixed(1)} c/s・残り ${fmtTime(eta)}${failed ? `・失敗 ${failed}` : ''}）`);
      onPartial(results);
    }
  });
  return results;
}

/* ============ 進捗プレビュー（末尾のみ表示してDOM負荷軽減） ============ */
function buildPreview(results, max = 20000) {
  const parts = [];
  for (let i = 0; i < results.length; i++) if (results[i]) parts.push(results[i]);
  let s = parts.join(' ');
  if (s.length > max) s = '…' + s.slice(-max);
  return s;
}

/* ============ メイン ============ */
translateBtn.addEventListener('click', async () => {
  const file = fileInput.files[0];
  if (!file) return alert('PDFファイルを選択してください');

  cancelFlag = false;
  translateBtn.disabled = true;
  cancelBtn.disabled = false;
  downloadBtn.disabled = true;
  originalEl.textContent = '';
  translatedEl.textContent = '';
  transBadge.hidden = true;
  translatedText = '';
  setProgress(0);
  statusEl.textContent = 'PDFを読み込み中...';

  const limitPages = parseInt(maxPagesEl.value, 10) || 0;

  try {
    const arrayBuffer = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;

    // ---- 抽出 ----
    const t0 = performance.now();
    const fullText = await extractAllPages(pdf, limitPages, (d, t, msg) => {
      statusEl.textContent = msg;
      setProgress((d / t) * 0.25); // 抽出は全体の25%に割り当て
    });
    if (cancelFlag) throw new Error('キャンセルされました');

    originalEl.textContent = fullText;
    origBadge.hidden = false;
    origBadge.textContent = `原文 ${fullText.length.toLocaleString()}字`;
    setProgress(0.25);

    // ---- チャンク分割 ----
    const chunks = splitText(fullText, CHUNK_SIZE);
    if (chunks.length === 0) throw new Error('テキストが抽出できませんでした（スキャンPDFの可能性）');

    // ---- 翻訳 ----
    const results = await translateAll(
      chunks,
      targetLang.value,
      (d, t, msg) => {
        statusEl.textContent = msg;
        setProgress(0.25 + (d / t) * 0.75);
      },
      (partial) => { translatedEl.textContent = buildPreview(partial); }
    );

    if (cancelFlag) {
      translatedText = results.filter(Boolean).join(' ');
      statusEl.textContent = '停止しました（途中までの翻訳を保存できます）';
    } else {
      translatedText = results.filter(Boolean).join(' ');
      statusEl.textContent = `完了（${fmtTime((performance.now() - t0) / 1000)}・${translatedText.length.toLocaleString()}字）`;
      setProgress(1);
    }
    translatedEl.textContent = translatedText;
    transBadge.hidden = false;
    transBadge.textContent = cancelFlag ? '部分' : '完成';
    autoOpen('accTranslated');
    downloadBtn.disabled = !translatedText;
  } catch (err) {
    console.error(err);
    statusEl.textContent = 'エラー: ' + err.message;
  } finally {
    translateBtn.disabled = false;
    cancelBtn.disabled = true;
  }
});

cancelBtn.addEventListener('click', () => {
  cancelFlag = true;
  cancelBtn.disabled = true;
  statusEl.textContent = '停止中...（進行中のリクエスト完了を待っています）';
});

downloadBtn.addEventListener('click', () => {
  const blob = new Blob([translatedText], { type: 'text/plain;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'translated.txt';
  a.click();
  URL.revokeObjectURL(a.href);
});
</script>

</body>
</html>
