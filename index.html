<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDF 全文自動翻訳</title>
<style>
  :root {
    --bg: #f7f8fa;
    --card: #ffffff;
    --border: #e2e5ea;
    --accent: #2563eb;
    --text: #1f2937;
    --muted: #6b7280;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans",
      "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 16px;
    line-height: 1.6;
    padding: env(safe-area-inset-top) env(safe-area-inset-right)
             env(safe-area-inset-bottom) env(safe-area-inset-left);
  }

  .wrap {
    max-width: 960px;
    margin: 0 auto;
    padding: 16px;
  }

  h1 {
    font-size: 1.25rem;
    margin: 8px 0 16px;
    text-align: center;
  }

  .controls {
    display: flex;
    flex-direction: column;
    gap: 10px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 12px;
  }

  .file-row {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .file-row label { font-size: 0.85rem; color: var(--muted); }

  input[type="file"] {
    width: 100%;
    font-size: 0.95rem;
    padding: 8px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: #fff;
  }

  .row-inline {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .row-inline > * { flex: 1 1 140px; }

  select {
    padding: 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: #fff;
    font-size: 1rem;
    width: 100%;
  }

  button {
    padding: 12px 16px;
    border: none;
    border-radius: 8px;
    background: var(--accent);
    color: #fff;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.15s;
    width: 100%;
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  button.secondary {
    background: #fff;
    color: var(--accent);
    border: 1px solid var(--accent);
  }

  #status {
    min-height: 1.2em;
    margin: 8px 4px;
    font-size: 0.9rem;
    color: var(--muted);
    text-align: center;
  }

  /* アコーディオン */
  .accordion {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    margin-bottom: 12px;
    overflow: hidden;
  }
  .accordion + .accordion { margin-top: 12px; }

  .acc-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px;
    cursor: pointer;
    user-select: none;
    font-weight: 600;
    background: #fff;
    transition: background 0.15s;
  }
  .acc-header:hover { background: #f1f3f7; }
  .acc-header .title {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 1rem;
  }
  .acc-header .arrow {
    transition: transform 0.25s ease;
    font-size: 0.9rem;
    color: var(--muted);
  }
  .accordion.open .acc-header .arrow {
    transform: rotate(180deg);
  }

  .acc-body {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.3s ease;
    border-top: 1px solid transparent;
  }
  .accordion.open .acc-body {
    border-top-color: var(--border);
  }

  .acc-content {
    padding: 12px 16px 16px;
    white-space: pre-wrap;
    word-break: break-word;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 0.9rem;
    line-height: 1.7;
    color: #111;
    background: #fafbfc;
    max-height: 60vh;
    overflow-y: auto;
  }

  .acc-content:empty::before {
    content: "（まだ内容がありません）";
    color: var(--muted);
    font-style: italic;
    font-family: inherit;
  }

  .badge {
    background: var(--accent);
    color: #fff;
    font-size: 0.7rem;
    padding: 2px 8px;
    border-radius: 999px;
    font-weight: 500;
  }

  /* PC 用の微調整 */
  @media (min-width: 640px) {
    body { font-size: 16px; }
    h1 { font-size: 1.5rem; margin-top: 16px; }
    .controls {
      flex-direction: row;
      align-items: flex-end;
      flex-wrap: wrap;
    }
    .file-row { flex: 2 1 260px; }
    .row-inline { flex: 1 1 auto; }
    button { width: auto; }
    .acc-content { font-size: 0.92rem; max-height: 65vh; }
  }
</style>
</head>
<body>

<div class="wrap">
  <h1>PDF 全文自動翻訳</h1>

  <div class="controls">
    <div class="file-row">
      <label for="pdfFile">PDFファイル</label>
      <input type="file" id="pdfFile" accept="application/pdf">
    </div>

    <div class="row-inline">
      <select id="targetLang" aria-label="翻訳先言語">
        <option value="ja">日本語</option>
        <option value="en">英語</option>
        <option value="ko">韓国語</option>
        <option value="zh-CN">中国語（簡体）</option>
        <option value="fr">フランス語</option>
        <option value="de">ドイツ語</option>
        <option value="es">スペイン語</option>
      </select>
      <button id="translateBtn">翻訳開始</button>
    </div>

    <div class="row-inline">
      <button id="downloadBtn" class="secondary" disabled>翻訳テキストをDL</button>
    </div>
  </div>

  <div id="status"></div>

  <!-- 原文アコーディオン -->
  <div class="accordion" id="accOriginal">
    <div class="acc-header" data-target="accOriginal">
      <span class="title">📄 原文 <span class="badge" id="origBadge" hidden></span></span>
      <span class="arrow">▼</span>
    </div>
    <div class="acc-body">
      <div class="acc-content" id="original"></div>
    </div>
  </div>

  <!-- 翻訳アコーディオン -->
  <div class="accordion" id="accTranslated">
    <div class="acc-header" data-target="accTranslated">
      <span class="title">🌐 翻訳 <span class="badge" id="transBadge" hidden></span></span>
      <span class="arrow">▼</span>
    </div>
    <div class="acc-body">
      <div class="acc-content" id="translated"></div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
const pdfjsLib = window.pdfjsLib;
pdfjsLib.GlobalWorkerOptions.workerSrc =
  'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

const fileInput    = document.getElementById('pdfFile');
const translateBtn = document.getElementById('translateBtn');
const downloadBtn  = document.getElementById('downloadBtn');
const statusEl     = document.getElementById('status');
const originalEl   = document.getElementById('original');
const translatedEl = document.getElementById('translated');
const targetLang   = document.getElementById('targetLang');
const origBadge    = document.getElementById('origBadge');
const transBadge   = document.getElementById('transBadge');

let translatedText = '';

/* ---------- アコーディオン ---------- */
document.querySelectorAll('.acc-header').forEach(header => {
  header.addEventListener('click', () => {
    const acc = document.getElementById(header.dataset.target);
    const body = acc.querySelector('.acc-body');
    const isOpen = acc.classList.toggle('open');

    // max-height をアニメーション用に動的設定
    if (isOpen) {
      body.style.maxHeight = body.scrollHeight + 'px';
      // 展開後はコンテンツのスクロールに任せるため auto に
      setTimeout(() => { if (acc.classList.contains('open')) body.style.maxHeight = 'none'; }, 320);
    } else {
      // 閉じるときに一旦固定
      body.style.maxHeight = body.scrollHeight + 'px';
      requestAnimationFrame(() => { body.style.maxHeight = '0px'; });
    }
  });
});

function refreshAccordionHeight(accId) {
  const acc = document.getElementById(accId);
  if (!acc.classList.contains('open')) return;
  const body = acc.querySelector('.acc-body');
  body.style.maxHeight = 'none';
}

function autoOpen(accId) {
  const acc = document.getElementById(accId);
  if (acc.classList.contains('open')) return;
  acc.classList.add('open');
  const body = acc.querySelector('.acc-body');
  body.style.maxHeight = 'none';
}

/* ---------- ファイル選択でバッジ表示 ---------- */
fileInput.addEventListener('change', () => {
  const f = fileInput.files[0];
  if (!f) return;
  origBadge.hidden = false;
  origBadge.textContent = f.name.length > 22 ? f.name.slice(0, 22) + '…' : f.name;
});

/* ---------- 翻訳処理 ---------- */
translateBtn.addEventListener('click', async () => {
  const file = fileInput.files[0];
  if (!file) return alert('PDFファイルを選択してください');

  translateBtn.disabled = true;
  downloadBtn.disabled = true;
  originalEl.textContent = '';
  translatedEl.textContent = '';
  origBadge.hidden = true;
  transBadge.hidden = true;
  translatedText = '';
  statusEl.textContent = 'PDFを読み込み中...';

  try {
    const arrayBuffer = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;

    // 1. テキスト抽出
    let fullText = '';
    for (let i = 1; i <= pdf.numPages; i++) {
      statusEl.textContent = `テキスト抽出中... ${i}/${pdf.numPages} ページ`;
      const page = await pdf.getPage(i);
      const content = await page.getTextContent();
      const pageText = content.items.map(item => item.str).join(' ');
      fullText += pageText + '\n\n';
    }
    originalEl.textContent = fullText;
    refreshAccordionHeight('accOriginal');

    // 2. 翻訳
    const chunks = splitText(fullText, 400);
    let result = '';

    for (let i = 0; i < chunks.length; i++) {
      statusEl.textContent = `翻訳中... ${i + 1}/${chunks.length}`;
      const t = await translateGoogle(chunks[i], targetLang.value);
      result += t + ' ';
      translatedEl.textContent = result;
      refreshAccordionHeight('accTranslated');
      await sleep(400);
    }

    translatedText = result.trim();
    translatedEl.textContent = translatedText;
    refreshAccordionHeight('accTranslated');

    origBadge.hidden = false;
    origBadge.textContent = `原文`;
    transBadge.hidden = false;
    transBadge.textContent = `完成`;

    autoOpen('accTranslated'); // 完了したら翻訳を自動展開
    statusEl.textContent = '完了';
    downloadBtn.disabled = false;
  } catch (err) {
    console.error(err);
    statusEl.textContent = 'エラー: ' + err.message;
  } finally {
    translateBtn.disabled = false;
  }
});

/* ---------- ユーティリティ ---------- */
function splitText(text, maxLen) {
  const sentences = text.split(/(?<=[。．.!?！？\n])/);
  const chunks = [];
  let cur = '';
  for (const s of sentences) {
    if ((cur + s).length > maxLen) {
      if (cur) chunks.push(cur);
      cur = s;
    } else {
      cur += s;
    }
  }
  if (cur) chunks.push(cur);
  return chunks;
}

async function translateGoogle(text, targetLang) {
  const url =
    'https://translate.googleapis.com/translate_a/single' +
    `?client=gtx&sl=auto&tl=${targetLang}&dt=t&q=${encodeURIComponent(text)}`;
  const res = await fetch(url);
  if (!res.ok) throw new Error('翻訳APIエラー: ' + res.status);
  const data = await res.json();
  return data[0].map(item => item[0]).join('');
}

function sleep(ms) {
  return new Promise(r => setTimeout(r, ms));
}

/* ---------- ダウンロード ---------- */
downloadBtn.addEventListener('click', () => {
  const blob = new Blob([translatedText], { type: 'text/plain;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'translated.txt';
  a.click();
  URL.revokeObjectURL(a.href);
});
</script>

</body>
</html>
