<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDF 全文自動翻訳</title>
<style>
  :root {
    --bg:#f7f8fa; --card:#fff; --border:#e2e5ea; --accent:#2563eb;
    --text:#1f2937; --muted:#6b7280; --danger:#dc2626;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans",
      "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
    background: var(--bg); color: var(--text); font-size:16px; line-height:1.6;
    margin:0; padding: env(safe-area-inset-top) env(safe-area-inset-right)
             env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .wrap { max-width:960px; margin:0 auto; padding:16px; }
  h1 { font-size:1.25rem; margin:8px 0 16px; text-align:center; }

  .panel {
    background: var(--card); border:1px solid var(--border); border-radius:12px;
    padding:14px; margin-bottom:12px; display:flex; flex-direction:column; gap:10px;
  }

  input[type="file"], select {
    width:100%; padding:12px; border:1px solid var(--border); border-radius:8px;
    background:#fff; font-size:1rem; color:var(--text);
  }

  .row { display:flex; gap:8px; flex-wrap:wrap; }
  .row > * { flex:1 1 140px; }

  button {
    padding:14px 18px; border:none; border-radius:8px; background:var(--accent);
    color:#fff; font-size:1rem; font-weight:600; cursor:pointer; width:100%;
  }
  button:disabled { opacity:.5; cursor:not-allowed; }
  button.secondary { background:#fff; color:var(--accent); border:1px solid var(--accent); }
  button.danger { background:#fff; color:var(--danger); border:1px solid var(--danger); }

  #status {
    min-height:1.4em; margin:6px 4px; font-size:.95rem; color:var(--text);
    text-align:center; font-weight:600;
  }
  #subStatus { text-align:center; color:var(--muted); font-size:.85rem; margin-bottom:8px; min-height:1.2em; }

  .progress { height:8px; background:#e5e7eb; border-radius:999px; overflow:hidden; margin:0 4px 12px; }
  .progress > div { height:100%; width:0%; background:var(--accent); transition:width .3s; }

  .accordion { background:var(--card); border:1px solid var(--border);
    border-radius:12px; margin-bottom:12px; overflow:hidden; }
  .acc-header {
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 16px; cursor:pointer; user-select:none; font-weight:600; background:#fff;
  }
  .acc-header:hover { background:#f1f3f7; }
  .acc-header .arrow { transition:transform .25s; font-size:.9rem; color:var(--muted); }
  .accordion.open .acc-header .arrow { transform:rotate(180deg); }
  .acc-body { max-height:0; overflow:hidden; transition:max-height .3s ease;
    border-top:1px solid transparent; }
  .accordion.open .acc-body { border-top-color:var(--border); }
  .acc-content {
    padding:12px 16px 16px; white-space:pre-wrap; word-break:break-word;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size:.9rem; line-height:1.7; color:#111; background:#fafbfc;
    max-height:60vh; overflow-y:auto;
  }
  .acc-content:empty::before { content:"（まだ内容がありません）"; color:var(--muted);
    font-style:italic; font-family:inherit; }

  @media (min-width:640px) {
    h1 { font-size:1.5rem; margin-top:16px; }
    .panel { flex-direction:row; align-items:center; flex-wrap:wrap; }
    .panel .grow { flex:1 1 220px; }
    button { width:auto; }
    .acc-content { font-size:.92rem; max-height:65vh; }
  }
</style>
</head>
<body>

<div class="wrap">
  <h1>PDF 全文自動翻訳</h1>

  <div class="panel">
    <div class="grow">
      <input type="file" id="pdfFile" accept="application/pdf">
    </div>
    <div class="grow">
      <select id="targetLang" aria-label="翻訳先言語">
        <option value="ja">日本語</option>
        <option value="en">英語</option>
        <option value="ko">韓国語</option>
        <option value="zh-CN">中国語（簡体）</option>
        <option value="fr">フランス語</option>
        <option value="de">ドイツ語</option>
        <option value="es">スペイン語</option>
      </select>
    </div>
    <button id="translateBtn">翻訳開始</button>
    <button id="cancelBtn" class="danger" disabled>停止</button>
    <button id="downloadBtn" class="secondary" disabled>ダウンロード</button>
  </div>

  <div id="status"></div>
  <div id="subStatus"></div>
  <div class="progress"><div id="progressBar"></div></div>

  <div class="accordion" id="accOriginal">
    <div class="acc-header" data-target="accOriginal">
      <span>📄 原文</span><span class="arrow">▼</span>
    </div>
    <div class="acc-body"><div class="acc-content" id="original"></div></div>
  </div>

  <div class="accordion" id="accTranslated">
    <div class="acc-header" data-target="accTranslated">
      <span>🌐 翻訳</span><span class="arrow">▼</span>
    </div>
    <div class="acc-body"><div class="acc-content" id="translated"></div></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
const pdfjsLib = window.pdfjsLib;
pdfjsLib.GlobalWorkerOptions.workerSrc =
  'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

/* 内部設定（速さ担当／UIには出しません） */
const EXTRACT_PARALLEL   = 10;
const TRANSLATE_PARALLEL = 6;
const PAGE_TEXT_LIMIT    = 1200;
const MAX_RETRY          = 3;
const UI_REFRESH_MS      = 1500;

/* DOM */
const fileInput    = document.getElementById('pdfFile');
const translateBtn = document.getElementById('translateBtn');
const cancelBtn    = document.getElementById('cancelBtn');
const downloadBtn  = document.getElementById('downloadBtn');
const statusEl     = document.getElementById('status');
const subStatusEl  = document.getElementById('subStatus');
const progressBar  = document.getElementById('progressBar');
const originalEl   = document.getElementById('original');
const translatedEl = document.getElementById('translated');
const targetLang   = document.getElementById('targetLang');

let translatedText = '';
let cancelFlag = false;

/* ============ アコーディオン ============ */
document.querySelectorAll('.acc-header').forEach(header => {
  header.addEventListener('click', () => {
    const acc = document.getElementById(header.dataset.target);
    const body = acc.querySelector('.acc-body');
    const isOpen = acc.classList.toggle('open');
    if (isOpen) {
      body.style.maxHeight = body.scrollHeight + 'px';
      setTimeout(() => { if (acc.classList.contains('open')) body.style.maxHeight = 'none'; }, 320);
    } else {
      body.style.maxHeight = body.scrollHeight + 'px';
      requestAnimationFrame(() => { body.style.maxHeight = '0px'; });
    }
  });
});
function autoOpen(id) {
  const acc = document.getElementById(id);
  if (acc.classList.contains('open')) return;
  acc.classList.add('open');
  acc.querySelector('.acc-body').style.maxHeight = 'none';
}

/* ============ ヘルパ ============ */
const sleep = ms => new Promise(r => setTimeout(r, ms));

function fmtEta(sec) {
  if (!isFinite(sec) || sec < 0) return '--:--';
  sec = Math.round(sec);
  const h = Math.floor(sec / 3600);
  const m = Math.floor((sec % 3600) / 60);
  const s = sec % 60;
  if (h > 0) return `${h}時間${m}分`;
  if (m > 0) return `${m}分${String(s).padStart(2,'0')}秒`;
  return `${s}秒`;
}

function setProgress(p) {
  progressBar.style.width = Math.max(0, Math.min(100, p * 100)) + '%';
}

/* 並列実行（内部専用） */
async function runPool(count, limit, worker) {
  let idx = 0;
  const runners = Array.from({ length: Math.min(limit, count) }, async () => {
    while (true) {
      if (cancelFlag) return;
      const i = idx++;
      if (i >= count) return;
      await worker(i);
    }
  });
  await Promise.all(runners);
}

/* 1ページ分のテキストを、長すぎる場合だけ複数に分ける */
function splitForTranslation(text, maxLen) {
  if (text.length <= maxLen) return [text];
  const sentences = text.split(/(?<=[。．.!?！？\n])/);
  const out = [];
  let cur = '';
  for (const s of sentences) {
    if (s.length > maxLen) {
      if (cur) { out.push(cur); cur = ''; }
      for (let i = 0; i < s.length; i += maxLen) out.push(s.slice(i, i + maxLen));
      continue;
    }
    if ((cur + s).length > maxLen) { out.push(cur); cur = s; }
    else cur += s;
  }
  if (cur) out.push(cur);
  return out;
}

/* 翻訳API（1回分） */
async function translateOnce(text, tl) {
  const url =
    'https://translate.googleapis.com/translate_a/single' +
    `?client=gtx&sl=auto&tl=${tl}&dt=t&q=${encodeURIComponent(text)}`;
  const res = await fetch(url);
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const data = await res.json();
  return data[0].map(x => x[0]).join('');
}

/* ページ1つ分を翻訳（内部で分割されたら順に処理） */
async function translatePage(text, tl) {
  const parts = splitForTranslation(text, PAGE_TEXT_LIMIT);
  const out = [];
  for (const p of parts) {
    let attempt = 0;
    while (true) {
      try { out.push(await translateOnce(p, tl)); break; }
      catch (e) {
        attempt++;
        if (attempt > MAX_RETRY) { out.push(''); break; }
        await sleep(300 * Math.pow(2, attempt - 1));
      }
    }
  }
  return out.join(' ');
}

/* ============ メイン処理 ============ */
translateBtn.addEventListener('click', async () => {
  const file = fileInput.files[0];
  if (!file) return alert('PDFファイルを選択してください');

  cancelFlag = false;
  translateBtn.disabled = true;
  cancelBtn.disabled = false;
  downloadBtn.disabled = true;
  originalEl.textContent = '';
  translatedEl.textContent = '';
  translatedText = '';
  setProgress(0);
  statusEl.textContent = 'PDFを読み込んでいます...';
  subStatusEl.textContent = '';

  const t0 = performance.now();

  try {
    const arrayBuffer = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
    const totalPages = pdf.numPages;

    /* --- 1. 全ページのテキストを並列で抜き出す --- */
    const pageTexts = new Array(totalPages);
    let extracted = 0;
    const extractStart = performance.now();

    await runPool(totalPages, EXTRACT_PARALLEL, async (i) => {
      const page = await pdf.getPage(i + 1);
      const content = await page.getTextContent();
      pageTexts[i] = content.items.map(it => it.str).join(' ') + '\n\n';
      page.cleanup();
      extracted++;
      const elapsed = (performance.now() - extractStart) / 1000;
      const eta = (totalPages - extracted) / (extracted / elapsed);
      statusEl.textContent = `読み込み中 ${extracted}/${totalPages}ページ 残り時間 ${fmtEta(eta)}`;
      setProgress((extracted / totalPages) * 0.2);
    });

    if (cancelFlag) throw new Error('停止しました');

    const fullText = pageTexts.join('');
    originalEl.textContent = fullText;
    setProgress(0.2);

    /* --- 2. ページごとに翻訳 --- */
    const results = new Array(totalPages);
    let done = 0;
    const transStart = performance.now();
    let lastUi = 0;

    await runPool(totalPages, TRANSLATE_PARALLEL, async (i) => {
      results[i] = await translatePage(pageTexts[i], targetLang.value);
      done++;

      const now = performance.now();
      if (now - lastUi > UI_REFRESH_MS || done === totalPages) {
        lastUi = now;
        const elapsed = (now - transStart) / 1000;
        const speed = done / elapsed;
        const eta = (totalPages - done) / speed;
        statusEl.textContent = `翻訳中 ${done}/${totalPages}ページ 残り時間 ${fmtEta(eta)}`;
        subStatusEl.textContent = `経過 ${fmtEta(elapsed)}`;
        setProgress(0.2 + (done / totalPages) * 0.8);
        // 途中経過を末尾だけ表示（負荷軽減）
        const preview = results.filter(Boolean).join(' ');
        translatedEl.textContent = preview.length > 20000
          ? '…' + preview.slice(-20000) : preview;
      }
    });

    /* --- 3. 完了 --- */
    translatedText = results.filter(Boolean).join(' ');
    translatedEl.textContent = translatedText;

    const totalElapsed = (performance.now() - t0) / 1000;
    if (cancelFlag) {
      statusEl.textContent = `停止しました（${done}/${totalPages}ページまで翻訳済み）`;
      subStatusEl.textContent = `経過 ${fmtEta(totalElapsed)}`;
    } else {
      statusEl.textContent = `完了（${totalPages}ページ・所要時間 ${fmtEta(totalElapsed)}）`;
      subStatusEl.textContent = `${translatedText.length.toLocaleString()}文字`;
      setProgress(1);
      autoOpen('accTranslated');
    }
    downloadBtn.disabled = !translatedText;
  } catch (err) {
    console.error(err);
    statusEl.textContent = 'エラー: ' + err.message;
    subStatusEl.textContent = '';
  } finally {
    translateBtn.disabled = false;
    cancelBtn.disabled = true;
  }
});

cancelBtn.addEventListener('click', () => {
  cancelFlag = true;
  cancelBtn.disabled = true;
  subStatusEl.textContent = '停止しています...（実行中の処理の完了を待っています）';
});

downloadBtn.addEventListener('click', () => {
  const blob = new Blob([translatedText], { type: 'text/plain;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'translated.txt';
  a.click();
  URL.revokeObjectURL(a.href);
});
</script>

</body>
</html>
